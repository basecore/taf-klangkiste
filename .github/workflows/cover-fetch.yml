name: Cover Cloud

on:
  workflow_dispatch:
    inputs:
      cover_url:
        description: "Cover image URL"
        required: true
        type: string
      output_name:
        description: "Output file name without extension"
        required: true
        type: string
      output_format:
        description: "Output format"
        required: true
        default: "jpg"
        type: choice
        options:
          - jpg
          - png
      quality:
        description: "JPEG quality 0.1..1.0"
        required: false
        default: "0.92"
        type: string

jobs:
  fetch-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Install Python + Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pil

      - name: Download cover and convert
        env:
          COVER_URL: ${{ inputs.cover_url }}
          OUTPUT_NAME: ${{ inputs.output_name }}
          OUTPUT_FORMAT: ${{ inputs.output_format }}
          QUALITY: ${{ inputs.quality }}
        run: |
          python3 - <<'PY'
          import os
          from io import BytesIO
          import requests
          from PIL import Image

          url = os.environ["COVER_URL"]
          out = os.environ["OUTPUT_NAME"].strip()
          fmt = os.environ["OUTPUT_FORMAT"].strip().lower()
          quality = float(os.environ.get("QUALITY", "0.92"))

          r = requests.get(url, timeout=30, headers={"User-Agent": "Mozilla/5.0"})
          r.raise_for_status()

          img = Image.open(BytesIO(r.content))
          if img.mode not in ("RGB", "RGBA"):
              img = img.convert("RGB")
          else:
              img = img.convert("RGB")

          os.makedirs("out", exist_ok=True)

          if fmt == "png":
              path = f"out/{out}.png"
              img.save(path, format="PNG")
          else:
              path = f"out/{out}.jpg"
              q = max(1, min(95, int(quality * 100)))
              img.save(path, format="JPEG", quality=q, optimize=True, progressive=True)

          print(path)
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cover-output
          path: out/*
          if-no-files-found: error
