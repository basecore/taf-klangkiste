name: Convert TAF to MP3 Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      payload_name:
        description: "Name der Payload-Datei in release-payloads/"
        required: true
        default: "latest.release.json"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

      - name: Locate payload
        shell: bash
        run: |
          mkdir -p work release-out
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "TAG=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
            if [ -f "release-payloads/${{ github.event.release.tag_name }}.release.json" ]; then
              cp "release-payloads/${{ github.event.release.tag_name }}.release.json" work/payload.json
            elif [ -f "release-payloads/latest.release.json" ]; then
              cp "release-payloads/latest.release.json" work/payload.json
            else
              echo "No payload found"
              exit 1
            fi
          else
            if [ -f "release-payloads/${{ inputs.payload_name }}" ]; then
              cp "release-payloads/${{ inputs.payload_name }}" work/payload.json
            else
              echo "No payload found"
              exit 1
            fi
          fi

      - name: Decode payload
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('work/payload.json','utf8'));
          fs.writeFileSync('work/input.taf.b64', p.base64);
          fs.writeFileSync('work/meta.json', JSON.stringify(p, null, 2));
          NODE
          base64 -d work/input.taf.b64 > work/input.taf

      - name: Convert with FFmpeg
        shell: bash
        run: |
          META=work/meta.json
          OUT="release-out/${{ github.event.release.tag_name || 'manual' }}.mp3"
          TITLE=$(jq -r '.title // "TAF Klangkiste"' "$META")
          ALBUM=$(jq -r '.album // "TAF Klangkiste"' "$META")
          DESC=$(jq -r '.description // ""' "$META")
          BITRATE=$(jq -r '.bitrate // "128k"' "$META")
          ffmpeg -y -i work/input.taf -vn -c:a libmp3lame -b:a "$BITRATE" -metadata title="$TITLE" -metadata album="$ALBUM" -metadata comment="$DESC" "$OUT"
          if jq -e '.cue == "yes"' "$META" >/dev/null 2>&1; then
            printf 'REM GENERATED BY TAF KLANGKISTE\nTITLE "%s"\nPERFORMER "%s"\nFILE "%s" MP3\n  TRACK 01 AUDIO\n    TITLE "Kapitel 1"\n    INDEX 01 00:00:00\n' "$TITLE" "$ALBUM" "$(basename "$OUT")" > "${OUT%.mp3}.cue"
          fi

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: |
            release-out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
